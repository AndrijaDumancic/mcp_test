services:
  mcp-servers:
    build: .
    container_name: demo-mcp-servers
    ports:
      - "10000:10000"
    environment:
      - PORT=10000
      - HOST=0.0.0.0
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-demo-secret-token}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Uncomment to use ngrok for public access
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "mcp-servers:10000"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - mcp-servers